[package]
name = "ichnote-desktop"
description = "Ichnote desktop app (Tauri shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name
# (see https://github.com/rust-lang/cargo/issues/8519).
name = "ichnote_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
anyhow.workspace = true
ichnote-core.workspace = true
tauri.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
