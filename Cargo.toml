[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ichnote/ichnote"
authors = ["Ichnote contributors"]

[workspace.dependencies]
ichnote-core = { path = "crates/ichnote-core" }
ichnote-sync = { path = "crates/ichnote-sync" }
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
