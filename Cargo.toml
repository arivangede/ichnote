[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arivangede/notetice"
authors = ["note-tice! contributors"]

[workspace.dependencies]
notetice-core = { path = "crates/notetice-core" }
anyhow = "1.0.104"
blake3 = "1.8.7"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
yrs = "0.28.1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
tempfile = "3.27.0"
uuid = { version = "1.29.3", features = ["v7", "serde"] }
tauri = { version = "2.12.7", features = [] }
tauri-build = { version = "2.7.6", features = [] }
tauri-plugin-dialog = "2.8.4"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"

# Size optimizations for release builds (https://tauri.app/concept/size/).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
